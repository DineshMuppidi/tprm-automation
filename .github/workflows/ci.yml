name: CI

# Branch testing (Phase 5 spec §3a): lint, unit+integration tests,
# security scans, build check — on every push and PR. Not run by an actual
# GitHub Actions runner in this sandbox (this repo has no git remote
# configured — see README) but written as a real, valid workflow; the
# jobs below run the exact same commands verified locally throughout
# Phases 0-5 (pytest, tsc, oxlint, pip-audit, npm audit, detect-secrets).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tprm
          POSTGRES_PASSWORD: tprm
          POSTGRES_DB: tprm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tprm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Secrets scan (detect-secrets, against committed baseline)
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --baseline ../.secrets.baseline \
            --exclude-files 'venv/' --exclude-files '.pytest_cache/' \
            > /tmp/current-scan.json
          python -c "
          import json
          baseline = json.load(open('../.secrets.baseline'))
          current = json.load(open('/tmp/current-scan.json'))
          known = {(f, h['hashed_secret']) for f, hs in baseline['results'].items() for h in hs}
          new = {(f, h['hashed_secret']) for f, hs in current['results'].items() for h in hs} - known
          if new:
              print('New potential secrets found, not in baseline:', new)
              raise SystemExit(1)
          print('No new secrets beyond the audited baseline.')
          "

      - name: Apply schema + seed data
        env:
          DATABASE_URL: postgresql://tprm:tprm@localhost:5432/tprm
        run: python db/init_db.py

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://tprm:tprm@localhost:5432/tprm
          AUTH_SECRET: ci-test-secret-not-for-production-use-only-here
          ADMIN_API_KEY: ci-test-admin-key
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Build check (Docker image)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: tprm-backend:ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high
      - run: npm run build

      - name: Build check (Docker image)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: tprm-frontend:ci
