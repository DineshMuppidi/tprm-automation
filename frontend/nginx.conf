# Serves the Vite SPA build. Listens on 8080 (not 80) since the container
# runs as a non-root user (Dockerfile) and can't bind privileged ports.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed build assets (Vite content-hashes filenames) can cache forever;
    # index.html must always be revalidated so a deploy is picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
