apiVersion: apps/v1
kind: Deployment
metadata:
  name: tprm-frontend
  namespace: tprm
  labels:
    app: tprm-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tprm-frontend
  template:
    metadata:
      labels:
        app: tprm-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: ghcr.io/OWNER/REPO/frontend:latest   # replaced by CD pipeline with a real tag; VITE_API_BASE_URL baked in at build time
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tprm-frontend
  namespace: tprm
spec:
  selector:
    app: tprm-frontend
  ports:
    - port: 80
      targetPort: 8080
